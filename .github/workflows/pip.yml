name: pip
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        module: ["madoka", "pondpond"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: python3 -m pip install --upgrade pip
      - run: pip install ${{ matrix.module }}
